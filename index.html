<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    
    <dialog>
            <form>
                <div class="dialog-title">Add a book!</div>

                <label for="title">Title:</label>
                <input type="text" name="title" id="title" required>

                <label for="author">Author:</label>
                <input type="text" name="author" id="author" required>

                <label for="pages">Pages:</label>
                <input type="number" name="pages" id="pages" required>

                <button type="submit" style="margin-top: 1rem; padding: 1rem;">Add Book</button>
            </form>
    </dialog>

    <div class="wrapper">
        <div class="header">
            <div class="title">
                <div class="main-title">My Library!</div>
                <div class="sub-title">This is where I document what books I have read,<br> the author, the pages, and if I read them or not!</div>
            </div>
           
            <div class="buttons">
                <button class="add">New</button>
            </div>
        </div>

        <div class="content">
        </div>
</body>
</html>
